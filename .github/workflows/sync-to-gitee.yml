name: Sync to Gitee

on:
  # 每天北京时间 08:00 自动运行（UTC 00:00）
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync to Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          
          GITEE_REMOTE="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/Facksxx/xi-xi-care.git"
          
          echo "=== 获取 GitHub 最新版本 ==="
          GITHUB_LATEST_TAG=$(git tag -l --sort=-v:refname | head -1 || echo "")
          GITHUB_MAIN_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
          echo "GitHub 最新标签: ${GITHUB_LATEST_TAG:-无}"
          echo "GitHub main 提交: ${GITHUB_MAIN_COMMIT:0:12}"
          echo ""
          
          echo "=== 获取 Gitee 当前版本 ==="
          GITEE_REFS=$(git ls-remote "$GITEE_REMOTE" 2>&1) || true
          
          GITEE_LATEST_TAG=""
          GITEE_MAIN_COMMIT=""
          
          if [ -n "$GITEE_REFS" ] && ! echo "$GITEE_REFS" | grep -qi "could not\|error\|fatal"; then
            GITEE_LATEST_TAG=$(echo "$GITEE_REFS" | grep 'refs/tags/' | awk -F/ '{print $3}' | sed 's/\^{}//' | sort -V | tail -1 || echo "")
            GITEE_MAIN_COMMIT=$(echo "$GITEE_REFS" | grep 'refs/heads/main' | awk '{print $1}' || echo "")
          fi
          echo "Gitee 最新标签: ${GITEE_LATEST_TAG:-无}"
          echo "Gitee main 提交: ${GITEE_MAIN_COMMIT:0:12}"
          echo ""
          
          echo "=== 比较版本号 ==="
          SHOULD_PUSH=false
          
          if [ -z "$GITEE_LATEST_TAG" ] && [ -z "$GITEE_MAIN_COMMIT" ]; then
            SHOULD_PUSH=true
            echo "原因: Gitee 仓库为空，需要完整推送"
          elif [ -n "$GITHUB_LATEST_TAG" ] && [ -n "$GITEE_LATEST_TAG" ]; then
            if [ "$GITHUB_LATEST_TAG" = "$GITEE_LATEST_TAG" ]; then
              if [ "$GITHUB_MAIN_COMMIT" = "$GITEE_MAIN_COMMIT" ]; then
                SHOULD_PUSH=false
                echo "原因: 版本号相同（$GITHUB_LATEST_TAG），无需推送"
              else
                SHOULD_PUSH=true
                echo "原因: 标签相同但提交不同，需要同步"
              fi
            else
              NEWEST=$(printf "%s\n%s\n" "$GITHUB_LATEST_TAG" "$GITEE_LATEST_TAG" | sort -V | tail -1)
              if [ "$NEWEST" = "$GITHUB_LATEST_TAG" ]; then
                SHOULD_PUSH=true
                echo "原因: GitHub($GITHUB_LATEST_TAG) > Gitee($GITEE_LATEST_TAG)，需要推送"
              else
                SHOULD_PUSH=false
                echo "原因: Gitee($GITEE_LATEST_TAG) >= GitHub($GITHUB_LATEST_TAG)，无需推送"
              fi
            fi
          elif [ -n "$GITHUB_LATEST_TAG" ]; then
            SHOULD_PUSH=true
            echo "原因: GitHub 有标签($GITHUB_LATEST_TAG)但 Gitee 无标签"
          else
            if [ "$GITHUB_MAIN_COMMIT" != "$GITEE_MAIN_COMMIT" ]; then
              SHOULD_PUSH=true
              echo "原因: 提交不同，需要同步"
            else
              SHOULD_PUSH=false
              echo "原因: 提交相同，无需推送"
            fi
          fi
          echo ""
          
          if [ "$SHOULD_PUSH" = true ]; then
            echo "=== 推送到 Gitee ==="
            git remote add gitee "$GITEE_REMOTE"
            git push gitee --all --force
            git push gitee --tags --force
            echo ""
            echo "✅ 同步完成！已将 GitHub 最新版本推送到 Gitee"
          else
            echo "✅ Gitee 已是最新版本，无需推送"
          fi
