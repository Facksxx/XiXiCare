name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # XiXiCare.apk is built locally with the long-lived signing key and
      # committed by release-apk.mjs. Rebuilding in CI would change its signature.
      - name: Verify packaged APK
        run: test -f XiXiCare.apk && sha256sum XiXiCare.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" XiXiCare.apk --title "XiXiCare ${GITHUB_REF_NAME}" --generate-notes
